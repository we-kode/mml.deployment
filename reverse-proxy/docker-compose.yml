services:
    wekode.mml.reverseproxy:
      image: ${IMAGE}
      container_name: wekode.mml.reverseproxy
      restart: always
      # Stops with a hint, if default.conf.template includes the listen configuration, but 15-mml-listen.sh is missing or not executable.
      entrypoint:
        - /bin/sh
        - -c
        - |
          script=/docker-entrypoint.d/15-mml-listen.sh
          if grep -q mml-listen.inc /etc/nginx/templates/default.conf.template && ! [ -f "$$script" -a -x "$$script" ]; then
            echo "MML: $$script is missing or not executable. Copy 15-mml-listen.sh next to default.conf.template on the host and run chmod +x on it. See the reverse proxy section of the backend setup documentation." >&2
            exit 1
          fi
          exec /docker-entrypoint.sh "$$@"
        - --
      command: ["nginx", "-g", "daemon off;"]
      user: ${UID}:${GID}
      ports:
        - "${SSL_PORT}:${INTERN_SSL_PORT}"
      volumes:
        - "${VOL_CERTS}:/etc/nginx/certs:ro,z"
        - "${CONF_TEMPLATE}/default.conf.template:/etc/nginx/templates/default.conf.template:Z"
        - "${CONF_TEMPLATE}/15-mml-listen.sh:/docker-entrypoint.d/15-mml-listen.sh:ro,Z"
        - "${PROXY_LOGS:-./logs}:/var/log/nginx/mml:Z"
        - /etc/localtime:/etc/localtime:ro
      environment:
        PROXY_TLS: ${PROXY_TLS:-true}
        TRUSTED_PROXY: ${TRUSTED_PROXY:-}
        CERT_NAME: ${CERT_NAME:-}
        INTERN_SSL_PORT: ${INTERN_SSL_PORT}
        FILE_UPLOAD_LIMIT: ${FILE_UPLOAD_LIMIT}
        REQUEST_MODE: ${REQUEST_MODE}
        RPS_LIMIT: ${RPS_LIMIT}
        RIP_CACHE: ${RIP_CACHE}
        RBURST_LIMIT: ${RBURST_LIMIT}
        IDENTITY_API_ADDRESS: ${IDENTITY_API_ADDRESS}
        IDENTITY_API_PORT: ${IDENTITY_API_PORT}
        MEDIA_API_ADDRESS: ${MEDIA_API_ADDRESS}
        MEDIA_API_PORT: ${MEDIA_API_PORT}

      logging:
            driver: "json-file"
            options:
                mode: "non-blocking"
                max-size: ${LOG_MAX_SIZE}
                max-file: ${LOG_MAX_FILE}
      networks:
            - wekode.mml

networks:
  wekode.mml:
    external: true
    name: wekode.mml
